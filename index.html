<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>HANA ACCORDION BASS</title><style>body{margin:0;background:#17212b;color:#f3f0e6;font-family:system-ui;touch-action:manipulation}header{padding:14px 16px;background:#243443}h1{font-size:20px;margin:0}small{color:#b9cbd4}.controls{display:flex;gap:12px;flex-wrap:wrap;padding:12px 16px;align-items:center}select,input{accent-color:#e7b96e}main{padding:12px;overflow:auto;touch-action:pan-x pan-y}.board{display:grid;grid-template-columns:repeat(12,minmax(62px,1fr));gap:7px;min-width:800px}.cell{border:1px solid #8294a2;background:#34485a;border-radius:30px;color:white;min-height:62px;font-size:15px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none}.bass{background:#77533c}.minor{background:#425c65}.seven{background:#555079}.dim{background:#5d465d}.cell.active{background:#e5b86d;color:#19222c;transform:scale(.96)}.rowlabel{font-size:12px;color:#d3c9b9;margin:12px 0 6px}footer{padding:12px 16px;color:#bdc8d2;font-size:13px}</style></head><body><header><h1>HANA ACCORDION BASS</h1><small>左手だけのアコーディオン / Stradella-style</small></header><div class="controls"><label>音量 <input id="volume" type="range" min="0" max="100" value="65"></label><label>音色 <select id="voice"><option value="reed">リード</option><option value="soft">ソフト</option></select></label><button id="panic">音を止める</button></div><main id="main"></main><footer>ボタンを押している間だけ鳴ります。ベースとコードを同時に押せます。最初のタッチで音声を有効化します。横スクロールで全キーを表示。</footer><script>
const roots=['Ab','Eb','Bb','F','C','G','D','A','E','B','F#','C#'];const pitch={C:0,'C#':1,D:2,Eb:3,E:4,F:5,'F#':6,G:7,Ab:8,A:9,Bb:10,B:11};const rows=[['対位ベース','counter'],['ベース','bass'],['メジャー','major'],['マイナー','minor'],['セブンス','seven'],['ディミニッシュ','dim']];let ctx,master;const active=new Map();const main=document.getElementById('main');const board=document.createElement('div');board.className='board';main.append(board);
function midi(n,oct){return 12*(oct+1)+((n%12)+12)%12}function freq(m){return 440*Math.pow(2,(m-69)/12)}function tones(root,type){let p=pitch[root];if(type==='bass')return [midi(p,2),midi(p,3)];if(type==='counter')return [midi(p+4,2),midi(p+4,3)];let intervals={major:[0,4,7],minor:[0,3,7],seven:[0,4,10],dim:[0,3,9]}[type];return intervals.map(x=>midi(p+x,3))}function start(el,root,type,id){if(active.has(id))return;ctx??=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();if(!master){master=ctx.createGain();master.gain.value=Number(document.getElementById('volume').value)/100*.32;master.connect(ctx.destination)}let nodes=[];let notes=tones(root,type);for(let note of notes){let osc=ctx.createOscillator(),osc2=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=document.getElementById('voice').value==='reed'?2300:1100;osc.type='sawtooth';osc2.type='triangle';osc.frequency.value=freq(note);osc2.frequency.value=freq(note)*1.006;gain.gain.setValueAtTime(0,ctx.currentTime);gain.gain.linearRampToValueAtTime(.14/notes.length,ctx.currentTime+.025);osc.connect(filter);osc2.connect(filter);filter.connect(gain);gain.connect(master);osc.start();osc2.start();nodes.push({osc,osc2,gain})}active.set(id,{nodes,el});el.classList.add('active')}
function stop(id){let a=active.get(id);if(!a)return;for(let n of a.nodes){n.gain.gain.cancelScheduledValues(ctx.currentTime);n.gain.gain.setTargetAtTime(0,ctx.currentTime,.045);n.osc.stop(ctx.currentTime+.24);n.osc2.stop(ctx.currentTime+.24)}a.el.classList.remove('active');active.delete(id)}
for(let [label,type] of rows){let title=document.createElement('div');title.className='rowlabel';title.textContent=label;main.insertBefore(title,board);let row=document.createElement('div');row.className='board';row.style.marginBottom='8px';main.insertBefore(row,board);for(let root of roots){let b=document.createElement('button');b.className='cell '+(type==='bass'||type==='counter'?'bass':type);b.textContent=type==='counter'?root+' 3rd':root+({bass:'',major:' M',minor:' m',seven:' 7',dim:' dim'}[type]);b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);start(b,root,type,e.pointerId)});b.addEventListener('pointerup',e=>stop(e.pointerId));b.addEventListener('pointercancel',e=>stop(e.pointerId));b.addEventListener('lostpointercapture',e=>stop(e.pointerId));row.append(b)}}board.remove();document.getElementById('volume').addEventListener('input',e=>{if(master)master.gain.value=Number(e.target.value)/100*.32});document.getElementById('panic').onclick=()=>{for(let id of [...active.keys()])stop(id)};document.addEventListener('visibilitychange',()=>{if(document.hidden)for(let id of [...active.keys()])stop(id)});
</script></body></html>
