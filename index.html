<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>HANA ACCORDION BASS</title><style>
*{box-sizing:border-box}body{margin:0;background:#18232d;color:#f6f0e3;font:16px system-ui,-apple-system,sans-serif}header{padding:16px}h1{font-size:22px;margin:0}small,.hint{color:#b9c8d1}.tools{display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px}button{font:inherit}.toggle{border:1px solid #80919c;background:#344654;color:white;padding:10px;border-radius:9px}input{accent-color:#e3b466}.hint{font-size:13px;line-height:1.5;margin:0;padding:0 16px 12px}.viewport{overflow-x:auto;padding:14px 16px 24px;touch-action:pan-x pan-y;-webkit-overflow-scrolling:touch}.board{display:grid;grid-template-columns:repeat(8,74px);grid-template-rows:repeat(4,70px);gap:9px 6px;width:max-content;transform:skewY(-5deg);transform-origin:top left;margin:18px 0 22px 12px}.key{border:2px solid #718696;border-radius:50%;width:66px;height:66px;color:#fff;background:#344b5c;font-size:15px;font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 #101923;transform:skewY(5deg)}.key.bass{background:#79543a}.key.minor{background:#465f69}.key.seven{background:#555078}.key.center{border:4px solid #f3c96e}.key.playing{background:#f4c873;color:#1d2932;box-shadow:0 1px 0 #101923}.key .type{font-size:10px;display:block;opacity:.85}.hide-labels .key .name{visibility:hidden}.legend{font-size:13px;color:#bdcbd3;padding:0 16px 20px}.legend strong{color:#f3c96e}
</style></head><body><header><h1>HANA ACCORDION BASS</h1><small>iPadで覚えるストラデラ式・左手伴奏</small></header><div class="tools"><button class="toggle" id="names">音名を隠す</button><label>音量 <input id="volume" type="range" min="0" max="100" value="65"></label><button class="toggle" id="stop">全音停止</button></div><p class="hint">上からベース・メジャー・マイナー・セブンス。横は五度進行。押している間だけ鳴ります。</p><div class="viewport"><div class="board" id="board"></div></div><div class="legend"><strong>C</strong> は基準位置。横スクロール可能。ベースとコードの同時押しもできます。音名を隠して暗記練習！</div><script>
const roots=['Ab','Eb','Bb','F','C','G','D','A'],pitch={C:0,'C#':1,D:2,Eb:3,E:4,F:5,'F#':6,G:7,Ab:8,A:9,Bb:10,B:11},kinds=[['bass','BASS'],['major','MAJ'],['minor','MIN'],['seven','7TH']];let ctx,master;const active=new Map(),board=document.getElementById('board');function midi(n,o){return 12*(o+1)+((n%12)+12)%12}function freq(m){return 440*2**((m-69)/12)}function notes(root,type){let p=pitch[root];return type==='bass'?[midi(p,2),midi(p,3)]:({major:[0,4,7],minor:[0,3,7],seven:[0,4,10]}[type]).map(n=>midi(p+n,3))}function init(){if(!ctx){ctx=new(window.AudioContext||window.webkitAudioContext)();master=ctx.createGain();master.gain.value=.65*.34;master.connect(ctx.destination)}ctx.resume()}function play(el,root,type,id){if(active.has(id))return;init();let voices=[],ns=notes(root,type);for(let n of ns){let osc=ctx.createOscillator(),osc2=ctx.createOscillator(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();osc.type='sawtooth';osc2.type='triangle';osc.frequency.value=freq(n);osc2.frequency.value=freq(n)*1.005;filter.type='lowpass';filter.frequency.value=2100;gain.gain.setValueAtTime(0,ctx.currentTime);gain.gain.linearRampToValueAtTime(.14/ns.length,ctx.currentTime+.025);osc.connect(filter);osc2.connect(filter);filter.connect(gain);gain.connect(master);osc.start();osc2.start();voices.push({osc,osc2,gain})}active.set(id,{voices,el});el.classList.add('playing')}function release(id){let a=active.get(id);if(!a)return;for(let v of a.voices){v.gain.gain.cancelScheduledValues(ctx.currentTime);v.gain.gain.setTargetAtTime(0,ctx.currentTime,.045);v.osc.stop(ctx.currentTime+.24);v.osc2.stop(ctx.currentTime+.24)}a.el.classList.remove('playing');active.delete(id)}for(let r=0;r<kinds.length;r++)for(let c=0;c<roots.length;c++){let root=roots[c],type=kinds[r][0],b=document.createElement('button');b.className='key '+type+(root==='C'?' center':'');b.style.gridRow=r+1;b.style.gridColumn=c+1;b.innerHTML='<span class="name">'+root+(type==='minor'?'m':type==='seven'?'7':'')+'</span><span class="type">'+kinds[r][1]+'</span>';b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);play(b,root,type,e.pointerId)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>release(e.pointerId));board.append(b)}document.getElementById('volume').addEventListener('input',e=>{if(master)master.gain.value=Number(e.target.value)/100*.34});document.getElementById('stop').onclick=()=>{for(let id of [...active.keys()])release(id)};document.getElementById('names').onclick=e=>{let hide=document.body.classList.toggle('hide-labels');e.currentTarget.textContent=hide?'音名を表示':'音名を隠す'};document.addEventListener('visibilitychange',()=>{if(document.hidden)for(let id of [...active.keys()])release(id)});
</script></body></html>
